<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
      <h1>My Todo List</h1>

      <div class="input-box">
        <input type="text" class="taskInput" id="taskInput" placeholder="Enter your task..." />
        <button id="addBtn">Add Task</button>
      </div>

      <div class="task-info">
        <p class="totalTasks">Total Tasks: <span id="totalTasks">0</span></p>
        <p class="completedTasks">Completed: <span id="completedTasks">0</span></p>
      </div>

      <ul id="taskList"></ul>
    </div>
    
</body>
<script src="app.js"></script>
</html>
